name: Tests automatises

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Executer les tests avec couverture
        run: |
          python -m pytest --cov=scripts --cov-report=term-missing --cov-report=xml -v

      - name: Afficher le rapport de couverture
        run: |
          echo "Couverture globale mesurée"